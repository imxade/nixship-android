name: Physical ARM64 acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-arm64
  cancel-in-progress: false

jobs:
  runtime-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build, test, and export the native ARM64 control plane
        run: |
          nix develop .#runtime-export --command \
            scripts/export-control-plane-closure.sh runtime-artifact

      - name: Upload verified ARM64 closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-arm64-${{ github.sha }}
          path: runtime-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  maestro:
    needs: runtime-arm64
    runs-on: [self-hosted, linux, android-controller]
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Download native ARM64 control-plane closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: control-plane-arm64-${{ github.sha }}
          path: runtime-artifact

      - name: Verify and import ARM64 closure
        run: |
          nix develop .#runtime-import --command \
            scripts/import-control-plane-closure.sh runtime-artifact

      - name: Build hermetic release APK
        run: nix build .#default --print-build-logs

      - name: Sign physical-test candidate
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          unsigned_apk="$(find -L result -type f -name '*.apk' -print -quit)"
          nix develop --command scripts/sign-apk.sh \
            "$unsigned_apk" \
            "$RUNNER_TEMP/nixship-android-physical-arm64-v8a.apk"

      - name: Run account, password, deployment, and Quick Tunnel journey
        env:
          ANDROID_APK: ${{ runner.temp }}/nixship-android-physical-arm64-v8a.apk
          MAESTRO_ARTIFACTS: ${{ runner.temp }}/nixship-maestro-evidence
        run: nix develop --command scripts/run-maestro-physical.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-arm64-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/nixship-maestro-evidence
          if-no-files-found: error
          retention-days: 30
