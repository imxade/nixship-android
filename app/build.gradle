plugins {
    id "com.android.application"
}

import groovy.json.JsonSlurper

def productConfig = new JsonSlurper().parse(rootProject.file("config/product.json"))
def targetAbi = System.getenv("ANDROID_ABI") ?: productConfig.android.abi
def bootstrapSha256 = productConfig.bootstrap.embeddedSha256ByAndroidAbi[targetAbi]
def bootstrapArchiveName = productConfig.bootstrap.archiveNameByAndroidAbi[targetAbi]
def runtimeSystem = productConfig.runtime.nixSystemByAndroidAbi[targetAbi]
if (!bootstrapSha256) {
    throw new GradleException("No pinned bootstrap checksum is configured for ABI " + targetAbi)
}
if (!runtimeSystem) {
    throw new GradleException("No Nix runtime system is configured for ABI " + targetAbi)
}
if (!bootstrapArchiveName) {
    throw new GradleException("No pinned bootstrap archive is configured for ABI " + targetAbi)
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    compileSdkVersion productConfig.android.compileSdk as Integer
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: productConfig.android.ndkVersion
    aaptOptions {
        // The Nix closure is already reproducibly gzip-compressed. Recompressing it wastes heap
        // and cannot reduce the APK meaningfully.
        // AAPT transparently expands .gz assets and strips their suffix. Use a
        // neutral extension and explicitly store the already-compressed archive.
        noCompress "bundle", "zip"
    }
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "androidx.core:core:1.6.0"
        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.4.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    // NIX-ON-DROID: Downstream version.
    defaultConfig {
        applicationId productConfig.android.applicationId
        versionCode productConfig.android.versionCode as Integer
        versionName productConfig.android.versionName
        // fdroid checkupdates looks for literal versionCode/versionName,
        // can't get fancy with these and use string interpolation and similar
        ndk {
          abiFilters targetAbi
        }

        minSdkVersion productConfig.android.minSdk as Integer
        targetSdkVersion productConfig.android.targetSdk as Integer

        if (appVersionName) versionName = appVersionName
        //validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class
        buildConfigField "String", "BOOTSTRAP_ASSET", "\"${productConfig.bootstrap.assetDirectory}/${productConfig.bootstrap.assetName}\""
        buildConfigField "String", "BOOTSTRAP_SHA256", "\"${bootstrapSha256}\""
        buildConfigField "long", "BOOTSTRAP_ARCHIVE_MAX_BYTES", "${productConfig.bootstrap.archiveMaxBytes}L"
        buildConfigField "String", "CONTROL_PLANE_ASSET", "\"${productConfig.controlPlane.assetDirectory}\""
        buildConfigField "String", "CONTROL_PLANE_REPOSITORY", "\"${productConfig.controlPlane.repositoryUrl}\""
        buildConfigField "String", "CONTROL_PLANE_BRANCH", "\"${productConfig.controlPlane.branch}\""
        buildConfigField "String", "CONTROL_PLANE_REVISION", "\"${productConfig.controlPlane.revision}\""
        buildConfigField "String", "RUNTIME_SYSTEM", "\"${runtimeSystem}\""
        buildConfigField "String", "NIX_CONFIG", "\"${productConfig.runtime.nixConfig}\""
        buildConfigField "long", "RUNTIME_ARCHIVE_MAX_BYTES", "${productConfig.runtime.archiveMaxBytes}L"
        buildConfigField "String", "SERVER_BIND_ADDRESS", "\"${productConfig.server.bindAddress}\""
        buildConfigField "int", "SERVER_PORT", "${productConfig.server.port}"
        buildConfigField "boolean", "ALLOW_NODE_INTERFACE_DISCOVERY", "${productConfig.server.allowNodeInterfaceDiscovery}"
        buildConfigField "String", "LOOPBACK_HOST", "\"${productConfig.webView.loopbackHost}\""
        buildConfigField "String", "HEALTH_PATH", "\"${productConfig.webView.healthPath}\""
        buildConfigField "String", "SETUP_CLAIM_PATH", "\"${productConfig.webView.setupClaimPath}\""
        buildConfigField "String", "QUICK_TUNNEL_HOST_SUFFIX", "\"${productConfig.webView.quickTunnelHostSuffix}\""
        buildConfigField "long", "POLL_INTERVAL_MILLIS", "${productConfig.webView.pollIntervalMillis}L"
        buildConfigField "int", "STARTUP_TIMEOUT_SECONDS", "${productConfig.webView.startupTimeoutSeconds}"
        buildConfigField "int", "SETUP_TOKEN_MIN_CHARACTERS", "${productConfig.webView.setupTokenMinCharacters}"
        buildConfigField "int", "SETUP_TOKEN_MAX_BYTES", "${productConfig.webView.setupTokenMaxBytes}"
        buildConfigField "long", "DIAGNOSTICS_REFRESH_MILLIS", "${productConfig.diagnostics.refreshIntervalMillis}L"
        buildConfigField "int", "DIAGNOSTICS_STALLED_SECONDS", "${productConfig.diagnostics.stalledAfterSeconds}"
        buildConfigField "int", "DIAGNOSTICS_EVENT_LOG_MAX_BYTES", "${productConfig.diagnostics.eventLogMaxBytes}"
        buildConfigField "int", "DIAGNOSTICS_DISPLAY_TAIL_BYTES", "${productConfig.diagnostics.displayTailBytes}"
        buildConfigField "int", "DIAGNOSTICS_PROCESS_EXIT_TAIL_CHARACTERS", "${productConfig.diagnostics.processExitTailCharacters}"

        manifestPlaceholders.TERMUX_PACKAGE_NAME = productConfig.android.applicationId
        manifestPlaceholders.TERMUX_APP_NAME = productConfig.android.appName
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        /* NIX-ON-DROID: Unused
        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
        */
        splits {
            abi {
                reset ()
                include targetAbi
                universalApk false
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
        if (System.getenv("ANDROID_RELEASE_KEYSTORE")) {
            release {
                storeFile file(System.getenv("ANDROID_RELEASE_KEYSTORE"))
                storePassword System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_RELEASE_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    /* NIX-ON-DROID: Unused
    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }
    */

    lintOptions {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("nixship-android_" + (apkVersionTag ? apkVersionTag : "debug") + "_" + (abi ? abi : targetAbi) + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("nixship-android_" + (apkVersionTag ? apkVersionTag : "release") + "_" + (abi ? abi : targetAbi) + ".apk")
            }
        }
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
